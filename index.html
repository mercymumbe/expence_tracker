<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expence Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
</head>

<body>
    <!--header section  -->
    <header class="topbar">
        <div class="user-info">

            <h1>PERSONAL FINANCE</h1>
            <p id="greeting">Hello there!</p>
        </div>
        <button id="settingsButton"><a href="https://fontawesome.comgear"><i class="fa-solid fa-gear"></i></a></button>
    </header>
<!-- main section -->
<main>
 <!-- Total expenses card -->
            <section class="balance-card">
                <div>
                    <p id="totalLabel">Total Expenses</p>
                    <h2 id="totalAmount">KES 0.00</h2>
                </div>

                <select id="periodSelect"
                        aria-label="Expense period">
                    <option value="today" selected>Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                
                </select>
            </section>
            <!-- Expense categories -->
            <section class="categories">
                <div class="section-heading">
                    <h2>Categories</h2>
                    <p>Spending overview</p>
                </div>

                <div class="category-grid" id="categoryGrid">
                    <!-- JavaScript will display category cards here -->
                </div>
            </section>
</main>

</body>

</html>
